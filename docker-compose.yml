services:
  emqx:
    image: emqx/emqx:latest
    container_name: reck-emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: reck-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: reck-timescaledb
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=reck
      - POSTGRES_DB=reck
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reck -d reck"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb-init:
    image: timescale/timescaledb:latest-pg16
    container_name: reck-timescaledb-init
    environment:
      - PGPASSWORD=password
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h timescaledb -U reck -d reck; do sleep 1; done
        psql -h timescaledb -U reck -d reck -c "
          CREATE TABLE IF NOT EXISTS signals (
            timestamp TIMESTAMPTZ NOT NULL,
            source TEXT NOT NULL,
            value DOUBLE PRECISION NOT NULL,
            unit TEXT
          );
          SELECT create_hypertable('signals', 'timestamp', if_not_exists => TRUE);
          CREATE TABLE IF NOT EXISTS decisions (
            timestamp TIMESTAMPTZ NOT NULL,
            action_id TEXT PRIMARY KEY,
            source TEXT NOT NULL,
            rule_name TEXT NOT NULL,
            proposed_value DOUBLE PRECISION,
            outcome TEXT NOT NULL,
            payload JSONB,
            gear INTEGER,
            rule_confidence DOUBLE PRECISION
          );
          CREATE INDEX IF NOT EXISTS idx_decisions_ts ON decisions(timestamp);
          CREATE TABLE IF NOT EXISTS operator_feedback (
            timestamp TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            action_id TEXT PRIMARY KEY,
            rating INTEGER NOT NULL,
            comment TEXT,
            processed BOOLEAN DEFAULT FALSE
          );
          CREATE TABLE IF NOT EXISTS gear_transitions (
            timestamp TIMESTAMPTZ NOT NULL,
            rule_name TEXT NOT NULL,
            gear_before INTEGER,
            gear_after INTEGER NOT NULL,
            confidence DOUBLE PRECISION NOT NULL
          );
        "
    depends_on:
      timescaledb:
        condition: service_healthy

  reck-core:
    build:
      context: ./reck-core
      dockerfile: Dockerfile
    container_name: reck-core
    environment:
      - MQTT_HOST=emqx
      - MQTT_PORT=1883
      - WATCH_PORT=50051
      - CONSTRAINTS_PATH=/app/constraints.yaml
    ports:
      - "50051:50051"
    volumes:
      - ./guard/constraints.yaml:/app/constraints.yaml:ro
    depends_on:
      emqx:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: reck-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      timescaledb:
        condition: service_healthy
