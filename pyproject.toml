[project]
name = "reck"
version = "0.1.0"
description = "Autonomous manufacturing intelligence"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "jsonschema>=4.0",
    "dowhy>=0.14",
    "causal-learn>=0.1.4.4",
    "networkx>=3.6.1",
    "pandas>=3.0.1",
    "confluent-kafka>=2.13.2",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "grpcio-testing>=1.60",
    "ruff>=0.3",
]

[project.scripts]
reck = "ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "act",
    "breaker",
    "escalate",
    "gate",
    "guard",
    "ledger",
    "memory",
    "monitor",
    "reason",
    "reck",
    "review",
    "rules",
    "sim",
    "triage",
    "watch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires external services (gRPC, Rust binary)"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]

[tool.pyright]
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "proto/*_pb2.py",
    "proto/*_pb2_grpc.py",
    "proto/*_pb2.pyi",
]
extraPaths = ["proto"]

